[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Ignore non-critical stylistic warnings for clean builds
ignored_warnings_from = [
    "block-timestamp",
    "reentrancy-events",
    "missing-events-access-control"
]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"